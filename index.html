.main{width:100%;max-width:430px;display:flex;flex-direction:column;gap:18px}

.code{font-size:40px;color:#22c55e;letter-spacing:4px}
.result-box,.fixed-pass{font-size:22px;min-height:70px}
.small,.timer,.footer,.copied,.error{text-align:center;font-size:13px;margin-top:8px}
